<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore an interactive Leapfrog Central geological model."
    />
    <meta name="theme-color" content="#07100f" />
    <title>Central Embedding | Interactive geological model</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="site-shell">
      <header class="site-header">
        <a class="brand" href="#model" aria-label="Central Embedding home">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>Central Embedding</span>
        </a>

        <div class="header-meta" aria-label="Model status">
          <span class="status-dot" aria-hidden="true"></span>
          Public scene
        </div>

        <a
          class="open-link"
          href="https://publicscenes.seequent.com/f027cce3-030c-4a35-9c98-026f40fa17e0"
          target="_blank"
          rel="noreferrer"
        >
          Open full screen
          <span aria-hidden="true">↗</span>
        </a>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Leapfrog Central · 3D geological model</p>
          <h1 id="page-title">Explore the subsurface.</h1>
        </div>
        <p class="intro-copy">
          Orbit, zoom and inspect the model directly in your browser.
        </p>
      </section>

      <section class="model-section" id="model" aria-label="Interactive model">
        <div class="model-chrome">
          <div class="model-label">
            <span class="model-index">01</span>
            <span>Central model</span>
          </div>
          <p>Interactive scene</p>
        </div>

        <div class="model-frame">
          <div class="model-loading" aria-hidden="true">
            <span class="loading-line"></span>
            Loading geological model
          </div>
          <iframe
            src="https://publicscenes.seequent.com/f027cce3-030c-4a35-9c98-026f40fa17e0"
            title="Interactive Leapfrog Central geological model"
            allow="fullscreen"
            loading="eager"
          ></iframe>
        </div>
      </section>

      <footer class="site-footer">
        <p>Interactive model hosted by Seequent.</p>
        <a
          href="https://publicscenes.seequent.com/f027cce3-030c-4a35-9c98-026f40fa17e0"
          target="_blank"
          rel="noreferrer"
        >
          View source scene
          <span aria-hidden="true">↗</span>
        </a>
      </footer>
    </main>
  </body>
</html>
